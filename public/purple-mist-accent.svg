<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 780" role="img" aria-label="Abstract purple mist accent">
  <defs>
    <filter id="mist-blur" x="-35%" y="-35%" width="170%" height="170%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="2" seed="7" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="14" xChannelSelector="R" yChannelSelector="G" result="warped" />
      <feGaussianBlur in="warped" stdDeviation="28" result="blurred" />
    </filter>
    <radialGradient id="violet-core" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(452 356) rotate(90) scale(210 160)">
      <stop offset="0" stop-color="#6D5EFC" stop-opacity="0.78" />
      <stop offset="0.45" stop-color="#8475FF" stop-opacity="0.48" />
      <stop offset="1" stop-color="#A99EFF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="lavender-soft" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(356 232) rotate(90) scale(250 196)">
      <stop offset="0" stop-color="#EAE7FF" stop-opacity="0.92" />
      <stop offset="0.55" stop-color="#E8E4FF" stop-opacity="0.55" />
      <stop offset="1" stop-color="#F7F6FF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="lavender-low" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(382 520) rotate(90) scale(238 180)">
      <stop offset="0" stop-color="#DDD8FF" stop-opacity="0.62" />
      <stop offset="0.55" stop-color="#E7E3FF" stop-opacity="0.38" />
      <stop offset="1" stop-color="#F7F6FF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="white-haze" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(268 400) rotate(90) scale(290 220)">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.76" />
      <stop offset="0.58" stop-color="#FAFAFF" stop-opacity="0.42" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <g filter="url(#mist-blur)">
    <ellipse cx="364" cy="236" rx="176" ry="148" fill="url(#lavender-soft)" />
    <ellipse cx="455" cy="362" rx="146" ry="186" fill="url(#violet-core)" />
    <ellipse cx="386" cy="526" rx="170" ry="160" fill="url(#lavender-low)" />
    <ellipse cx="258" cy="430" rx="182" ry="170" fill="url(#white-haze)" />
    <ellipse cx="510" cy="152" rx="92" ry="104" fill="#F2F0FF" opacity="0.62" />
    <ellipse cx="512" cy="612" rx="122" ry="138" fill="#E9E5FF" opacity="0.44" />
    <ellipse cx="180" cy="604" rx="96" ry="86" fill="#FBFAFF" opacity="0.36" />
  </g>
</svg>
