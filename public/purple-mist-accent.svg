        <feFuncA type="table" tableValues="0.35 0.62 0.48 0.78 0.58 0.86 0.72 0.98"/>
      </feComponentTransfer>
      <feComposite in="warped" in2="grainMask" operator="in" result="textured"/>
      <feGaussianBlur in="textured" stdDeviation="0.55"/>
    </filter>
